[project]
name = "termscope"
version = "0.1.0"
description = "Process evaluation and error localization for Hy3 agents on Terminal-Bench 2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
